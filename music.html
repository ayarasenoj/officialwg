<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weirdo Gang | Music & Videos</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      color: white;
      font-family: 'Montserrat', sans-serif;
    }

    header {
      background: linear-gradient(to right, #990000, #f43f5e, #3b82f6);
      padding: 60px 20px;
      text-align: center;
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      letter-spacing: 4px;
      text-shadow: 0 0 15px #fff;
    }

    nav {
      background: #000;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 15px;
    }

    nav a {
      color: #990000;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #f43f5e;
    }

    section {
      padding: 60px 20px;
      text-align: center;
    }

    .section-dark {
      background-color: #1a1a1a;
    }

    .members img, .merch img {
      width: 200px;
      height: auto;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .merch {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    footer {
      background: #000;
      color: #aaa;
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
    }

    #video-intro {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  z-index: 9999;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

#video-intro img {
  width: 100%;
  height: auto;
  max-height: 95vh;
  object-fit: contain;
}


#video-intro .smoke-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('images/smoke.png') repeat;
  background-size: cover;
  opacity: 0;
  animation: smokeIn 4s forwards ease-in;
}

@keyframes smokeIn {
  0% {
    opacity: 0;
    background-position: center bottom;
  }
  50% {
    opacity: 0.6;
    background-position: center center;
  }
  100% {
    opacity: 1;
    background-position: center top;
  }
}


.fade-out {
  animation: fadeOut 2s forwards ease-out;
}

@keyframes fadeOut {
  to {
    opacity: 0;
    visibility: hidden;
  }
}
    #main-content {
  opacity: 0;
  transition: opacity 2s ease;
}

#video-intro .smoke-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('images/smoke.png') repeat;
  background-size: cover;
  opacity: 0;
  animation: smokeIn 4s forwards ease-in,
             smokeRise 15s linear infinite;
}

@keyframes smokeRise {
  0% { background-position: center bottom; }
  100% { background-position: center top; }
}

    .video-wrapper {
  position: relative;
  padding-bottom: 56.25%; /* 16:9 ratio */
  padding-top: 25px;
  height: 0;
  overflow: hidden;
  max-width: 100%;
}

.video-wrapper iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

    body {
  overflow-x: hidden;
}

@media (max-width: 768px) {
  #video-intro img {
    content: url('images/intro-mobile.png');
    object-fit: cover;
    width: 100%;
    height: 100vh;
  }

  #video-intro .smoke-overlay {
    background-size: contain;
  }

  .video-wrapper {
    padding-top: 25px;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    max-width: 100%;
  }

  .video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
}

  </style>
</head>
<body>
<!-- VIDEO INTRO ANIMATION -->
<div id="video-intro">
  <img src="images/video-intro.png" alt="Weirdo Gang Intro Image">
  <div class="smoke-overlay"></div>
</div>
  
<div id="main-content" style="display: none;">


  <footer>
  <p>&copy; 2025 Official Weirdo Gang. All rights reserved.</p>
</footer>

<script>
  setTimeout(() => {
    document.getElementById('video-intro').classList.add('fade-out');

    const main = document.getElementById('main-content');
    main.style.display = 'block';
    
    // Delay a little to allow it to load, then fade in
    setTimeout(() => {
      main.style.opacity = 1;
    }, 100);
  }, 4500);
</script>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weirdo Gang | Music & Videos</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      color: white;
      font-family: 'Montserrat', sans-serif;
    }

    header {
      background: linear-gradient(to right, #facc15, #f43f5e, #3b82f6);
      padding: 60px 20px;
      text-align: center;
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      letter-spacing: 4px;
      text-shadow: 0 0 15px #fff;
    }

    nav {
      background: #000;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 15px;
    }

    nav a {
      color: #facc15;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #f43f5e;
    }

    section {
      padding: 60px 20px;
      text-align: center;
    }

    .section-dark {
      background-color: #1a1a1a;
    }

    .members img, .merch img {
      width: 200px;
      height: auto;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .merch {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    footer {
      background: #000;
      color: #aaa;
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
    }

    #video-intro {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  z-index: 9999;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

#video-intro img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#video-intro .smoke-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('images/smoke.png') repeat;
  background-size: cover;
  opacity: 0;
  animation: smokeIn 4s forwards ease-in;
}

@keyframes smokeIn {
  0% { opacity: 0; }
  50% { opacity: 0.6; }
  100% { opacity: 1; }
}

.fade-out {
  animation: fadeOut 2s forwards ease-out;
}

@keyframes fadeOut {
  to {
    opacity: 0;
    visibility: hidden;
  }
}
    #main-content {
  opacity: 0;
  transition: opacity 2s ease;
}


  </style>
</head>
<body>
<!-- VIDEO INTRO ANIMATION -->
<div id="video-intro">
  <img src="images/video-intro.png" alt="Weirdo Gang Intro Image">
  <div class="smoke-overlay"></div>
</div>
  
<div id="main-content" style="display: none;">
  <section id="music">
    <h2>Music & Videos</h2>
    <p>Drop your latest heat right here.</p>

    <div class="video-wrapper">
      <iframe width="560" height="315"
        src="https://www.youtube.com/embed/r_n3T-SLsUM?si=LPKROGnU-As?si=4JlgpWQ10u3nLXH3"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
  </section>
</div>

  <nav>
  <a href="index.html">Home</a>
  <a href="music.html">Music & Videos</a>
  <a href="#tour">Shows</a>
  <a href="#apparel">Apparel</a>
  <a href="#contact">Contact</a>
</nav>


  <section id="music">
    <h2>Music & Videos</h2>
    <p>Drop your latest heat right here.</p>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/r_n3T-SLsUM?si=EpvzGSwK8SyHfyKM" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </section>

  <footer>
  <p>&copy; 2025 Official Weirdo Gang. All rights reserved.</p>
</footer>

<script>
  setTimeout(() => {
    document.getElementById('video-intro').classList.add('fade-out');

    const main = document.getElementById('main-content');
    main.style.display = 'block';
    
    // Delay a little to allow it to load, then fade in
    setTimeout(() => {
      main.style.opacity = 1;
    }, 100);
  }, 4500);
</script>


</body>
</html>

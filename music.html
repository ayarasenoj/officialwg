<html lang="en">

  <title>Weirdo Gang | Music & Videos</title>

  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      color: white;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(to right, #990000, #f43f5e, #3b82f6);
      padding: 60px 20px;
      text-align: center;
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      letter-spacing: 4px;
      text-shadow: 0 0 15px #fff;
    }

    nav {
      background: #000;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
      padding: 15px;
    }

    nav a {
      color: #990000;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #f43f5e;
    }

    #video-intro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #video-intro img {
      width: 100%;
      height: auto;
      max-height: 95vh;
      object-fit: contain;
    }

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>#GangRelated – Coming Soon</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('images/gangrelated-cover.jpg') no-repeat center center fixed;
      background-size: 70%;
      background-position: center;
      font-family: 'Montserrat', sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      backdrop-filter: brightness(0.6);
      overflow: hidden;
    }

    #intro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      flex-direction: column;
    }

    #intro-video {
      max-width: 100%;
      max-height: 100vh;
      display: none;
      visibility: hidden;
    }

    #enter-btn {
      padding: 14px 28px;
      background: #f43f5e;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      font-size: 1.1rem;
    }

    p {
      font-size: 1.2rem;
      max-width: 500px;
      margin-bottom: 2rem;
      text-shadow: 0 0 6px #000;
    }

    .button-group a {
      display: inline-block;
      background: #f43f5e;
      color: white;
      padding: 12px 24px;
      margin: 10px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .button-group a:hover {
      background: #990000;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.8rem;
      color: #ccc;
    }

    @media (max-width: 600px) {
      body {
        background-position: top center;
        background-size: contain;
        background-repeat: no-repeat;
        background-attachment: scroll;
      }
    }
  </style>
</head>
<body>

  <!-- 🔥 INTRO SCREEN -->
  <div id="intro">
    <video id="intro-video" src="images/gangrelated-intro.mp4" autoplay playsinline></video>
    <button id="enter-btn" onclick="playIntro()">Enter Site</button>
  </div>

  <!-- 🔻 GATE MESSAGE -->
  <p>Our debut album is almost here. Pre-save now and join the gang to stay locked in.</p>

  <div class="button-group">
    <a href="https://your-presave-link.com" target="_blank">Pre-Save Now</a>
    <a href="https://your-newsletter-signup.com" target="_blank">Join the Newsletter</a>
  </div>

  <footer>
    Full site launching on drop day.
  </footer>

  <!-- 🔐 REDIRECT + VIDEO LOGIC -->
  <script>
    const dropDate = new Date("2025-08-24T00:00:00");
    const now = new Date();
    if (now >= dropDate) {
      window.location.href = "home.html";
    }

    function playIntro() {
      const intro = document.getElementById('intro');
      const video = document.getElementById('intro-video');

      video.style.display = 'block';
      video.style.visibility = 'visible';
      document.getElementById('enter-btn').style.display = 'none';

      video.play();

      video.onended = function () {
        intro.style.display = 'none';
        document.body.style.overflow = 'auto';
      };
    }
  </script>
</body>
</html>

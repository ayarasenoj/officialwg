<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>#GangRelated – Coming Soon</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('images/gangrelated-cover.jpg') no-repeat center center fixed;
      background-size: 70%;
      background-color: black;
      font-family: 'Montserrat', sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      backdrop-filter: brightness(0.6);
    }

    p {
      font-size: 1.2rem;
      max-width: 500px;
      margin-bottom: 2rem;
      text-shadow: 0 0 6px #000;
    }

    .button-group a {
      display: inline-block;
      background: #f43f5e;
      color: white;
      padding: 12px 24px;
      margin: 10px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .button-group a:hover {
      background: #990000;
    }

    form {
      max-width: 400px;
      margin: 0 auto 2rem auto;
      width: 90%;
    }

    form label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      text-shadow: 0 0 6px #000;
    }

    form input[type="email"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
    }

    form button {
      background: #f43f5e;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    form button:hover {
      background: #990000;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.8rem;
      color: #ccc;
    }
  </style>
</head>
<body>

  <!-- 🔻 Main message -->
  <p>Our debut album is almost here. Pre-save now and join the gang to stay locked in.</p>

  <!-- 🔻 Button for Pre-Save -->
  <div class="button-group">
    <a href="https://your-presave-link.com" target="_blank">Pre-Save Now</a>
  </div>

  <!-- 🔻 Newsletter signup form (Formspree embed) -->
  <form action="https://formspree.io/f/meoadvab" method="POST">
    <label for="email">Join the Newsletter</label>
    <input 
      type="email" 
      name="email" 
      id="email" 
      required 
      placeholder="Enter your email"
    >
    <button type="submit">Subscribe</button>
  </form>

  <footer>
    Full site launching on drop day.
  </footer>

  <!-- 🔒 Redirect script for launch day -->
  <script>
    const dropDate = new Date("2025-08-24T00:00:00");
    const now = new Date();
    if (now >= dropDate) {
      window.location.href = "home.html";
    }
  </script>

</body>
</html>

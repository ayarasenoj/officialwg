<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>#GangRelated – Coming Soon</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      <div id="enter-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; color: white; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 10000;">
  <h1 style="margin-bottom: 20px; font-size: 2rem;">Weirdo Gang Presents:</h1>
  <button onclick="playIntro()" style="padding: 12px 24px; font-size: 1.2rem; font-weight: bold; background-color: #f43f5e; color: white; border: none; border-radius: 6px; cursor: pointer;">Enter Site</button>
</div>

<video id="intro-video" preload="auto" playsinline style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 9999;">
  <source src="images/gangrelated-intro.mp4" type="video/mp4">
</video>

      margin: 0;
      padding: 0;
      background: black;
      font-family: 'Montserrat', sans-serif;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .intro-screen {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      z-index: 10;
    }

    .intro-screen button {
      background: #f43f5e;
      border: none;
      padding: 16px 32px;
      font-size: 1.5rem;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
      z-index: 11;
    }

    .intro-screen button:hover {
      background: #990000;
    }

    .video-intro {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 9;
      display: none;
    }

    .video-shown {
      display: block;
    }

    .video-hidden {
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
      pointer-events: none;
    }

    .gate-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: url('images/gangrelated-cover.jpg') no-repeat center center fixed;
      background-size: 70%;
      backdrop-filter: brightness(0.6);
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
      z-index: 1;
      padding: 20px;
    }

    .gate-content p {
      font-size: 1.2rem;
      max-width: 500px;
      margin-bottom: 2rem;
      text-shadow: 0 0 6px #000;
    }

    .button-group a {
      display: inline-block;
      background: #f43f5e;
      color: white;
      padding: 12px 24px;
      margin: 10px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .button-group a:hover {
      background: #990000;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.8rem;
      color: #ccc;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 🎬 VIDEO BACKGROUND -->
  <video id="introVideo" class="video-intro" playsinline>
    <source src="images/gangrelated-intro.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- 🔘 CLICK TO ENTER -->
  <div class="intro-screen" id="introScreen">
    <button id="enterBtn">Enter the Site</button>
  </div>

  <!-- 🔓 GATE CONTENT -->
  <div class="gate-content" id="gateContent">
    <p>Our debut album is almost here. Pre-save now and join the gang to stay locked in.</p>

    <div class="button-group">
      <a href="https://your-presave-link.com" target="_blank">Pre-Save Now</a>
      <a href="https://your-newsletter-signup.com" target="_blank">Join the Newsletter</a>
    </div>

    <footer>
      Full site launching on drop day.
    </footer>
  </div>

  <!-- 🔁 Redirect script -->
  <script>
    const dropDate = new Date("2025-08-24T00:00:00");
    const now = new Date();
    if (now >= dropDate) {
      window.location.href = "home.html";
    }

    const introVideo = document.getElementById('introVideo');
    const gateContent = document.getElementById('gateContent');
    const introScreen = document.getElementById('introScreen');
    const enterBtn = document.getElementById('enterBtn');

    enterBtn.addEventListener('click', () => {
      introVideo.classList.add('video-shown');
      introScreen.style.display = 'none';
      introVideo.play();
    });

    function revealGate() {
      introVideo.classList.add('video-hidden');
      gateContent.style.opacity = 1;
    }

    introVideo.addEventListener('ended', revealGate);

    // Fallback timeout in case video doesn’t fire
    setTimeout(() => {
      if (!introVideo.ended) revealGate();
    }, 12000);
  </script>

</body>
</html>

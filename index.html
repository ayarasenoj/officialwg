<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>#GangRelated – Coming Soon</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      color: white;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    #intro-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 9999;
      display: none;
    }

    #enter-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #f43f5e;
      color: white;
      padding: 16px 32px;
      border: none;
      border-radius: 8px;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 2;
    }

    #enter-button:hover {
      background: #990000;
    }

    #gate-content {
      display: none;
      position: relative;
      background: url('images/gangrelated-cover.jpg') no-repeat center center fixed;
      background-size: 70%;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      transition: opacity 2s ease;
    }

    #gate-content.show-gate {
      display: flex;
      opacity: 1;
    }

    #gate-content p {
      font-size: 1.2rem;
      max-width: 500px;
      margin-bottom: 2rem;
      text-shadow: 0 0 6px #000;
    }

    .button-group a {
      display: inline-block;
      background: #f43f5e;
      color: white;
      padding: 12px 24px;
      margin: 10px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .button-group a:hover {
      background: #990000;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.8rem;
      color: #ccc;
    }

    @media (max-width: 768px) {
      #gate-content {
        background-size: cover;
      }
    }
  </style>
</head>
<body>

  <video id="intro-video" autoplay playsinline>
    <source src="images/gangrelated-teaser.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <button id="enter-button">Enter Site</button>

  <div id="gate-content">
    <p>Our debut album is almost here. Pre-save now and join the gang to stay locked in.</p>
    <div class="button-group">
      <a href="https://your-presave-link.com" target="_blank">Pre-Save Now</a>
      <a href="https://formspree.io/f/meoadvab" target="_blank">Join the Newsletter</a>
    </div>
    <footer>
      Full site launching on drop day.
    </footer>
  </div>

  <script>
    const enterButton = document.getElementById("enter-button");
    const introVideo = document.getElementById("intro-video");
    const gateContent = document.getElementById("gate-content");

    enterButton.addEventListener("click", () => {
      enterButton.style.display = "none";
      introVideo.style.display = "block";
      introVideo.play();

      introVideo.addEventListener("ended", () => {
        introVideo.style.display = "none";
        gateContent.classList.add("show-gate");
      });

      setTimeout(() => {
        if (!gateContent.classList.contains("show-gate")) {
          introVideo.style.display = "none";
          gateContent.classList.add("show-gate");
        }
      }, 12000);
    });

    const dropDate = new Date("2025-08-24T00:00:00");
    const now = new Date();
    if (now >= dropDate) {
      window.location.href = "home.html";
    }
  </script>

</body>
</html>

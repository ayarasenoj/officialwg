<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>#GangRelated Album Gate</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Video Intro Styles */
    #videoIntro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: black;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #videoIntro video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: -1;
    }

    #videoIntro button {
      z-index: 10000;
      background: #f43f5e;
      color: white;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Main Gate Page Styles */
    #mainGate {
      display: none;
      height: 100vh;
      width: 100vw;
      background: url('images/gangrelated-cover.jpg') no-repeat center center fixed;
      background-size: 70%; /* You said you wanted this exact % */
      background-color: black;
      background-blend-mode: multiply;
      position: relative;
    }

    .newsletter-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 1rem;
    }

    /* Newsletter Modal */
    #newsletterModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }

    #newsletterModal form {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      text-align: center;
    }

    #newsletterModal input[type="email"] {
      padding: 0.5rem;
      width: 80%;
      margin-bottom: 1rem;
    }

    #newsletterModal button[type="submit"] {
      padding: 0.5rem 1rem;
      background-color: #f43f5e;
      color: white;
      border: none;
    }

    #newsletterModal a {
      display: block;
      margin-top: 1rem;
      color: #333;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Video Intro -->
  <div id="videoIntro">
    <video id="introVideo" autoplay playsinline muted="false">
      <source src="images/gangrelated-intro.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
    <button onclick="enterSite()">Enter Site</button>
  </div>

  <!-- Main Gate Page -->
  <div id="mainGate">
    <a href="#" class="newsletter-btn" onclick="document.getElementById('newsletterModal').style.display='flex'">Join the Newsletter</a>
  </div>

  <!-- Newsletter Modal -->
  <div id="newsletterModal">
    <form method="POST" action="https://formspree.io/f/meoadvab">
      <h2>Subscribe</h2>
      <input type="email" name="email" placeholder="Your email" required />
      <br />
      <button type="submit">Subscribe</button>
      <a href="#" onclick="document.getElementById('newsletterModal').style.display='none'">Close</a>
    </form>
  </div>

  <script>
    function enterSite() {
      const intro = document.getElementById("videoIntro");
      const mainGate = document.getElementById("mainGate");

      intro.style.transition = "opacity 1s ease";
      intro.style.opacity = "0";

      setTimeout(() => {
        intro.style.display = "none";
        mainGate.style.display = "block";
      }, 1000);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>#GangRelated – Coming Soon</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      color: white;
      background-color: black;
      overflow: hidden;
    }

    .intro-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    .enter-button {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #f43f5e;
      padding: 16px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      z-index: 2;
      transition: background 0.3s ease;
    }

    .enter-button:hover {
      background: #990000;
    }

    .gate-content {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      padding: 20px;
      background: url('images/gangrelated-cover.jpg') no-repeat center center fixed;
      background-size: 70%;
      backdrop-filter: brightness(0.6);
      z-index: 3;
    }

    .gate-content p {
      font-size: 1.2rem;
      max-width: 500px;
      margin-bottom: 2rem;
      text-shadow: 0 0 6px #000;
    }

    .button-group a {
      display: inline-block;
      background: #f43f5e;
      color: white;
      padding: 12px 24px;
      margin: 10px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .button-group a:hover {
      background: #990000;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.8rem;
      color: #ccc;
    }

    @media (max-width: 768px) {
      .gate-content {
        background-size: cover;
      }
    }
  </style>
</head>
<body>

  <!-- 🔥 INTRO VIDEO -->
  <video class="intro-video" id="introVideo" autoplay playsinline preload="auto">
    <source src="images/gangrelated-intro.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- 🎯 CLICK TO ENTER BUTTON -->
  <button class="enter-button" onclick="enterSite()">Enter Site</button>

  <!-- 🚪 GATE CONTENT AFTER VIDEO -->
  <div class="gate-content" id="gateContent">
    <p>Our debut album is almost here. Pre-save now and join the gang to stay locked in.</p>

    <div class="button-group">
      <a href="https://your-presave-link.com" target="_blank">Pre-Save Now</a>
      <a href="#" onclick="openNewsletterPopup()">Join the Newsletter</a>
    </div>

    <footer>
      Full site launching on drop day.
    </footer>
  </div>

  <!-- ✨ Newsletter popup placeholder -->
  <script>
    function openNewsletterPopup() {
      window.open('https://formspree.io/f/meoadvab', '_blank');
    }

    function enterSite() {
      const video = document.getElementById('introVideo');
      const gate = document.getElementById('gateContent');
      video.style.display = 'none';
      document.querySelector('.enter-button').style.display = 'none';
      gate.style.display = 'flex';
    }

    const dropDate = new Date("2025-08-24T00:00:00");
    const now = new Date();
    if (now >= dropDate) {
      window.location.href = "home.html";
    }
  </script>

</body>
</html>

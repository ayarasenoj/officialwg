
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>#GangRelated – Coming Soon</title>
  <style>
    body {

      padding: 0;

      background-size: 70%;
      background-color: black;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

    p {

    .countdown div {

    .countdown span {

      margin-top: 5px;

    .button-group a {

    .button-group a:hover {

    }

    form {
      max-width: 400px;
      margin: 0 auto 2rem auto;

    form label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      text-shadow: 0 0 6px #000;

    form input[type="email"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
    }

    form button {
      background: #f43f5e;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    form button:hover {
      background: #990000;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.8rem;
      color: #ccc;
    }
  </style>
</head>
<body>

  <!-- 🔻 Main message -->
  <p>Our debut album is almost here. Pre-save link coming soon. Sign up to stay locked in.</p>

  <!-- 🔻 Countdown Timer -->
  <div class="countdown" id="countdown">
    <div><div id="days">00</div><span>Days</span></div>
    <div><div id="hours">00</div><span>Hours</span></div>
    <div><div id="minutes">00</div><span>Minutes</span></div>
    <div><div id="seconds">00</div><span>Seconds</span></div>
  </div>

  <!-- 🔻 Button for Pre-Save -->
  <div class="button-group">
    <a href="presave.html">Pre-save Now</a>

  </div>

  <!-- 🔻 Newsletter signup form -->
  <form action="https://formspree.io/f/meoadvab" method="POST">
    <label for="email">Join the Newsletter</label>
    <input 
      type="email" 
      name="email" 
      id="email" 
      required 
      placeholder="Enter your email"
    >
    <button type="submit">Subscribe</button>
  </form>

  <footer>
    Full site launching on drop day.
  </footer>

  <!-- 🔄 Countdown Timer Script -->
  <script>
    const countdown = () => {
      const end = new Date("2025-08-25T00:00:00").getTime();
      const now = new Date().getTime();
      const distance = end - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = days.toString().padStart(2, '0');
      document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
      document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
      document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');

      if (distance < 0) {
        document.getElementById("countdown").innerHTML = "Album is out now!";
      }
    };

    setInterval(countdown, 1000);
    countdown();
  </script>

</body>
